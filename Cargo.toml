[package]
name = "lunar_calendar"
version = "2.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
serde = ["dep:serde", "ganzhiwuxing/serde"]
swagger = ["dep:utoipa", "dep:serde_json", "ganzhiwuxing/swagger"]

[dependencies]
ganzhiwuxing = { git = "https://github.com/wlhyl/ganzhiwuxin.git", branch = "rust" }
rust-swe = { git = "https://github.com/wlhyl/rust-swe.git" }

serde = { version = "*", features = ["derive"], optional = true }
serde_json = { version = "*", optional = true }
utoipa = { version = "*", optional = true }

[dev-dependencies]
dotenvy = "0.15.7"
